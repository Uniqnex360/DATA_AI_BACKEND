# settings.yml

# CRITICAL FIX 1: Set to false. 
# If true, SearXNG uses 50+ other engines that ignore your "site:" filters.
use_default_settings: false 

server:
  secret_key: "12121123123"
  limiter: false
  image_proxy: false

search:
  safe_search: 0
  default_lang: "en"
  formats:
    - html
    - json

outgoing:
  request_timeout: 10.0
  useragent_suffix: ""
  pool_connections: 100
  pool_maxsize: 20
  enable_http2: true

engines:
  # ── GOOGLE ──────────────────────────────────────────
  # Best at respecting "site:domain.com"
  - name: google
    engine: google
    shortcut: g
    categories: general
    timeout: 10
    weight: 3
    disabled: false

  # ── BING ────────────────────────────────────────────
  - name: bing
    engine: bing
    shortcut: b
    categories: general
    timeout: 10
    weight: 2
    disabled: false

  # ── BRAVE ───────────────────────────────────────────
  # Very strict with SKU and MPN matching
  - name: brave
    engine: brave
    shortcut: brave
    categories: general
    timeout: 10
    weight: 1
    disabled: false

  # ── IMAGES ──────────────────────────────────────────
  # Keep these separate from the "general" product search
  - name: google images
    engine: google_images
    categories: images
    disabled: false

  - name: bing images
    engine: bing_images
    categories: images
    disabled: false