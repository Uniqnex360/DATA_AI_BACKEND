# settings.yml

use_default_settings: false 

server:
  secret_key: "12121123123"
  limiter: false
  image_proxy: false

search:
  safe_search: 0
  default_lang: "en"
  formats:
    - html
    - json

outgoing:
  request_timeout: 15.0
  useragent_suffix: ""
  pool_connections: 100
  pool_maxsize: 20
  enable_http2: true

engines:
  # ── DISABLED (all blocked/CAPTCHA'd) ────────────────
  - name: google
    engine: google
    shortcut: g
    categories: general
    disabled: true

  - name: brave
    engine: brave
    shortcut: brave
    categories: general
    disabled: true

  # ── BING (primary, may be rate-limited) ─────────────
  - name: bing
    engine: bing
    shortcut: b
    categories: general
    timeout: 15.0
    weight: 3
    disabled: false

  # ── DUCKDUCKGO (reliable, no CAPTCHA) ───────────────
  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
    categories: general
    timeout: 15.0
    weight: 2
    disabled: false

  # ── MOJEEK (independent crawler, great for products) ─
  - name: mojeek
    engine: mojeek
    shortcut: mj
    categories: general
    timeout: 15.0
    weight: 2
    disabled: false
    base_url: https://www.mojeek.com

  # ── QWANT (European, good for technical specs) ──────
  - name: qwant
    engine: qwant
    shortcut: qw
    categories: general
    timeout: 15.0
    weight: 1
    disabled: false

  # ── WIKIPEDIA (for brand/product info) ──────────────
  - name: wikipedia
    engine: wikipedia
    shortcut: wp
    categories: general
    timeout: 15.0
    weight: 1
    disabled: false

  # ── IMAGES ──────────────────────────────────────────
  - name: google images
    engine: google_images
    categories: images
    disabled: false

  - name: bing images
    engine: bing_images
    categories: images
    disabled: false